<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log In — AdNetX</title>
<meta name="robots" content="noindex" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="auth-shell">
  <div class="auth-card glass">
    <div class="brand" style="justify-content:center; margin-bottom:8px;">
      <span class="brand-mark">Ax</span> AdNetX
    </div>
    <h2 style="text-align:center; font-size:1.5rem; margin-bottom:4px;">Welcome back</h2>
    <p class="text-muted" style="text-align:center; font-size:0.9rem; margin-bottom:26px;">Log in to your publisher dashboard</p>

    <form id="loginForm">
      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email" />
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input id="password" type="password" required autocomplete="current-password" />
        <div style="text-align:right; margin-top:6px;">
          <a href="forgot-password.html" style="font-size:0.8rem; color:var(--signal); font-weight:600;">Forgot password?</a>
        </div>
      </div>
      <p class="form-error" id="loginError"></p>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Log In</button>
    </form>

    <div style="display:flex; align-items:center; gap:12px; margin:22px 0;">
      <div style="flex:1; height:1px; background:var(--border);"></div>
      <span class="text-muted" style="font-size:0.8rem;">or</span>
      <div style="flex:1; height:1px; background:var(--border);"></div>
    </div>

    <button id="googleBtn" class="btn btn-outline btn-block">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.3 35 24 35c-6.1 0-11-4.9-11-11s4.9-11 11-11c2.8 0 5.3 1 7.3 2.7l6-6C33.7 6.5 29.1 4.5 24 4.5 12.9 4.5 4 13.4 4 24.5S12.9 44.5 24 44.5c11.1 0 20-9 20-20 0-1.4-.1-2.7-.4-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.7 19 12.5 24 12.5c2.8 0 5.3 1 7.3 2.7l6-6C33.7 6.5 29.1 4.5 24 4.5c-7.6 0-14.1 4.3-17.7 10.2z"/><path fill="#4CAF50" d="M24 44.5c5.1 0 9.7-1.9 13.2-5.1l-6.1-5.2c-2 1.4-4.6 2.3-7.1 2.3-5.3 0-9.7-3.5-11.2-8.3l-6.5 5C9.9 40.1 16.4 44.5 24 44.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3-3.1 5.3-5.9 6.9l6.1 5.2C39.1 37.4 44 31.6 44 24.5c0-1.4-.1-2.7-.4-4z"/></svg>
      Continue with Google
    </button>

    <p class="text-muted" style="text-align:center; font-size:0.88rem; margin-top:24px;">
      Don't have an account? <a href="register.html" style="color:var(--signal); font-weight:600;">Sign up free</a>
    </p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth.js"></script>
<script>
  const loginForm = document.getElementById("loginForm");
  const loginError = document.getElementById("loginError");
  const loginBtn = document.getElementById("loginBtn");

  loginForm.addEventListener("submit", (e) => {
    e.preventDefault();
    hideError(loginError);
    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in…";
    loginUser(
      { email: email.value.trim(), password: password.value },
      {
        onSuccess: () => (window.location.href = "../dashboard/index.html"),
        onError: (msg) => {
          showError(loginError, msg);
          loginBtn.disabled = false;
          loginBtn.textContent = "Log In";
        },
      }
    );
  });

  document.getElementById("googleBtn").addEventListener("click", () => {
    loginWithGoogle({
      onSuccess: () => (window.location.href = "../dashboard/index.html"),
      onError: (msg) => showError(loginError, msg),
    });
  });
</script>
</body>
</html>
