<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password — AdNetX</title>
<meta name="robots" content="noindex" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="auth-shell">
  <div class="auth-card glass">
    <div class="brand" style="justify-content:center; margin-bottom:8px;">
      <span class="brand-mark">Ax</span> AdNetX
    </div>
    <h2 style="text-align:center; font-size:1.4rem; margin-bottom:4px;">Reset your password</h2>
    <p class="text-muted" style="text-align:center; font-size:0.88rem; margin-bottom:26px;">We'll email you a reset link</p>

    <form id="resetForm">
      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email" />
      </div>
      <p class="form-error" id="resetError"></p>
      <p id="resetSuccess" style="display:none; color:var(--mint); font-size:0.88rem; margin-bottom:14px;">
        Reset link sent — check your inbox.
      </p>
      <button type="submit" class="btn btn-primary btn-block" id="resetBtn">Send Reset Link</button>
    </form>

    <p class="text-muted" style="text-align:center; font-size:0.88rem; margin-top:24px;">
      <a href="login.html" style="color:var(--signal); font-weight:600;">← Back to log in</a>
    </p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth.js"></script>
<script>
  const resetForm = document.getElementById("resetForm");
  const resetError = document.getElementById("resetError");
  const resetSuccess = document.getElementById("resetSuccess");
  const resetBtn = document.getElementById("resetBtn");

  resetForm.addEventListener("submit", (e) => {
    e.preventDefault();
    hideError(resetError);
    resetSuccess.style.display = "none";
    resetBtn.disabled = true;
    resetBtn.textContent = "Sending…";
    resetPassword(email.value.trim(), {
      onSuccess: () => {
        resetSuccess.style.display = "block";
        resetBtn.disabled = false;
        resetBtn.textContent = "Send Reset Link";
      },
      onError: (msg) => {
        showError(resetError, msg);
        resetBtn.disabled = false;
        resetBtn.textContent = "Send Reset Link";
      },
    });
  });
</script>
</body>
</html>
